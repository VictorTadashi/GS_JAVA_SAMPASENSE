spring.application.name=sampasense-api

# Porta: o Render injeta a variável PORT; localmente usa 8080
server.port=${PORT:8080}

# ===== Banco de dados Oracle (FIAP) =====
# As credenciais NUNCA ficam no código: são lidas de variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# ===== JPA / Hibernate =====
# update: cria/ajusta as tabelas automaticamente (o script database/ddl.sql é a versão oficial do modelo)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Segurança (JWT) =====
# Chave secreta (Base64, 256 bits) que assina os tokens. Em produção, defina a variável JWT_SECRET.
jwt.secret=${JWT_SECRET:HNYsguKhdCBQvHLY8kOjPkEDhBH8d2vHz/nk8sU8PZY=}
jwt.expiracao-horas=2

# ===== Dados de exemplo (simulados) carregados na primeira execução =====
sampasense.seed.enabled=${SEED_ENABLED:true}
# Usuário de demonstração criado automaticamente (para testar o login)
sampasense.demo.email=${DEMO_EMAIL:operador@sampasense.com}
sampasense.demo.senha=${DEMO_SENHA:Sampa@2026}

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html

# ===== JSON =====
spring.jackson.serialization.fail-on-empty-beans=false
